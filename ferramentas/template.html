<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>
:root{--navy:#021436;--navy2:#0a2559;--blue:#0a68c4;--gold:#f2b04f;--white:#fff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--navy);font-family:Poppins,sans-serif;color:#fff}
.card{position:relative;width:1080px;height:1920px;overflow:hidden}
.photo{position:absolute;inset:0;background:url('destino.jpg') center 35%/cover}
.shade{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(2,20,54,.70) 0%,rgba(2,20,54,.05) 18%,rgba(2,20,54,.15) 28%,rgba(2,20,54,.55) 36%,rgba(2,20,54,.96) 58%,var(--navy) 100%)}
.top{position:absolute;top:150px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:flex-start}
.logobox{background:rgba(2,20,54,.92);border-radius:28px;padding:18px 26px;box-shadow:0 10px 30px rgba(0,0,0,.3)}.logo{height:150px;display:block}
.chip{background:var(--gold);color:var(--navy);font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;padding:14px 26px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.chip b{font-weight:900}
.content{position:absolute;left:64px;right:64px;bottom:230px}
.kicker{text-shadow:0 2px 12px rgba(0,0,0,.6);font-size:30px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
h1{font-size:118px;line-height:1.02;font-weight:800;letter-spacing:-.02em;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.hotel{text-shadow:0 2px 14px rgba(0,0,0,.5);font-size:34px;font-weight:500;margin-top:12px;opacity:.95}
.hotel strong{font-weight:700}
.facts{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
.fact{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.10);border:1.5px solid rgba(255,255,255,.22);border-radius:18px;padding:14px 20px;font-size:26px;font-weight:500}
.fact svg{width:30px;height:30px;flex:none;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.price{margin-top:34px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.from{font-size:26px;opacity:.75}
.from s{opacity:.9}
.inst{display:flex;align-items:baseline;gap:10px;line-height:1}
.inst .x{font-size:44px;font-weight:700}
.inst .big{font-size:140px;font-weight:800;color:var(--gold);letter-spacing:-.03em}
.inst .cents{font-size:44px;font-weight:800;color:var(--gold)}
.cash{font-size:26px;margin-top:10px;opacity:.9}
.off{flex:none;width:180px;height:180px;border-radius:50%;background:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.35);transform:rotate(-8deg)}
.off .n{font-size:76px;font-weight:900;line-height:.9}
.off .n small{font-size:40px}
.off .t{font-size:24px;font-weight:700;letter-spacing:.12em}
.cta{margin-top:36px;display:flex;align-items:center;justify-content:center;gap:14px;background:#fff;color:var(--navy);font-size:34px;font-weight:800;border-radius:999px;padding:26px 30px}
.cta svg{width:38px;height:38px;fill:#25d366}
.legal{margin-top:22px;font-size:19px;opacity:.6;text-align:center;line-height:1.4}
</style></head>
